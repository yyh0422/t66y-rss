name: 更新 RSS

on:
  workflow_dispatch:          # 允许手动点一下立即跑

# 注：原 schedule 定时触发（每 30 分钟）已移除。
# 原因：GitHub 网页编辑器会在 cron 行自动插入 "→ Runs every 30 minutes" 文本，
# 导致 YAML 语法错误使 workflow 无法解析。如需恢复定时，请在本地用 git 修改后推送。

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取技术讨论区并生成 RSS
        run: python3 fetch.py .

      - name: 有变化就提交
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add feed.xml content_cache.json
          git diff --cached --quiet || git commit -m "更新 feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
